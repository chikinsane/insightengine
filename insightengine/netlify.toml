[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The Next.js plugin generates this exact function name — must match exactly.
[functions."___netlify-server-handler"]
  node_bundler = "nft"
  # better-sqlite3 has a prebuilt .node file that statically links SQLite —
  # no external .so dependencies, unlike DuckDB. Mark it external so NFT
  # copies the prebuilt binary as-is instead of trying to bundle it.
  included_files = ["node_modules/better-sqlite3/**"]
  external_node_modules = ["better-sqlite3"]
